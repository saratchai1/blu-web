<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d7f2f7" />
    <meta name="description" content="ป่าชายเลน แสงอาทิตย์ และผืนน้ำ — ฉากธรรมชาติ 3D แบบอินเทอร์แอคทีฟ" />
    <title>BLU — Mangrove</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230b716c'/%3E%3Cpath d='M16 45C13 22 30 13 49 14C49 34 39 49 20 46L42 22' fill='%23c9ecc1' stroke='%23c9ecc1' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="app" aria-label="ฉากป่าชายเลนสามมิติ">
      <div id="poster" class="poster" aria-hidden="true"></div>
      <canvas id="scene" tabindex="0" role="img" aria-label="ป่าชายเลนสามมิติและน้ำสะท้อนแสง ลากเพื่อเปลี่ยนมุมมอง ใช้ปุ่มลูกศรเพื่อมองรอบ ๆ"></canvas>
      <div class="atmosphere" aria-hidden="true"></div>
      <div id="foreground-left" class="foreground foreground-left" aria-hidden="true"></div>
      <div id="foreground-right" class="foreground foreground-right" aria-hidden="true"></div>
      <div id="loading" class="loading" role="status"><span class="loading-ripple"></span><span>กำลังเปิดผืนป่า</span></div>
      <div id="fallback" class="fallback" hidden>
        <p>แสดงฉากนิ่งแทน 3D</p>
        <span id="fallback-detail">อุปกรณ์นี้ยังเปิดกราฟิกสามมิติไม่ได้</span>
        <button id="retry" type="button">ลองเปิดฉาก 3D</button>
      </div>
      <p id="hint" class="hint">ลากเบา ๆ เพื่อมองรอบผืนป่า</p>
      <div id="toolbar" class="toolbar" role="toolbar" aria-label="ควบคุมฉาก">
        <button id="motion" type="button" aria-label="หยุดการเคลื่อนไหว" title="หยุดการเคลื่อนไหว" aria-pressed="false"></button>
        <span class="separator" aria-hidden="true"></span>
        <button id="light" type="button" aria-label="เปลี่ยนเป็นแสงเย็น" title="เปลี่ยนเป็นแสงเย็น" aria-pressed="false"></button>
        <button id="reset" type="button" aria-label="กลับมุมมองเริ่มต้น" title="กลับมุมมองเริ่มต้น"></button>
        <button id="fullscreen" type="button" aria-label="เต็มจอ" title="เต็มจอ" aria-pressed="false"></button>
        <span class="separator" aria-hidden="true"></span>
        <button id="hide-ui" type="button" aria-label="ซ่อนปุ่มควบคุม" title="ซ่อนปุ่มควบคุม (H)"></button>
      </div>
      <button id="show-ui" class="show-ui" type="button" aria-label="แสดงปุ่มควบคุม" title="แสดงปุ่มควบคุม (H)" hidden></button>
      <p id="toast" class="toast" role="status" aria-live="polite"></p>
      <noscript><p class="noscript">เปิด JavaScript เพื่อชมฉากป่าชายเลนสามมิติ</p></noscript>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
